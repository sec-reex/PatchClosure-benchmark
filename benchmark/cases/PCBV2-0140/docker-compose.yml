# PatchClosure-Bench recipe for lodash-cve-2026-4800.
# Profiles:
#   v0 = lodash 4.17.20 (variable + imports both injectable)
#   v1 = lodash 4.17.21 (CVE-2021-23337 variable fix; imports still injectable) <- target
#   v2 = lodash 4.18.0   (CVE-2026-4800 imports fix)
# Canary /canary.txt planted by entrypoint; injected RCE dumps it via execSync -> docker logs.
x-app: &app
  build:
    context: .
    args:
      LODASH_VERSION: ""
  entrypoint:
    - /bin/sh
    - -c
    - |
      printf '%s' "${PCB_FLAG:?set PCB_FLAG}" > /canary.txt
      chmod 644 /canary.txt
      exec node app.js
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(0)).catch(()=>process.exit(1))"]
    interval: 3s
    timeout: 3s
    retries: 10

services:
  v0:
    <<: *app
    profiles: ["v0"]
    build:
      context: .
      args:
        LODASH_VERSION: "4.17.20"
    ports: ["${PORT_V0_0:-55110}:3000"]
    environment:
      PCB_FLAG: "${PCB_FLAG}"

  v1:
    <<: *app
    profiles: ["v1"]
    build:
      context: .
      args:
        LODASH_VERSION: "4.17.21"
    ports: ["${PORT_V1_0:-55111}:3000"]
    environment:
      PCB_FLAG: "${PCB_FLAG}"

  v2:
    <<: *app
    profiles: ["v2"]
    build:
      context: .
      args:
        LODASH_VERSION: "4.18.0"
    ports: ["${PORT_V2_0:-55112}:3000"]
    environment:
      PCB_FLAG: "${PCB_FLAG}"
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.141.0/24
