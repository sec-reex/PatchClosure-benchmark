case_id: PCBV2-0183
public_name: redos_adobe_css_tools
run_mode: real-app-http
oracle_family: dos_threshold
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  # Runtime npm-installs the published @adobe/css-tools package (4.3.0 / 4.3.1).
  type: npm
  repo: https://github.com/adobe/css-tools.git
  v0: "4.3.0"
  v1: "4.3.1"
service:
  # Compose publishes ${PORT_V*_0}:3000. Platform HTTP on :3000 would miss.
  # start.sh / reset.sh wait until GET /health answers on the published port.
  readiness: none
  exposed_ports: [3000]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
