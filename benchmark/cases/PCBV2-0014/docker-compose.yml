# PatchClosure-Bench recipe for xxe_phpspreadsheet_ucs4 -- REAL WEB APP, EXTERNAL HTTP UPLOAD.
#
# Pair: CVE-2019-12331 (V1=TARGET, incomplete) -> CVE-2024-47873 (V2 fix, commit 31d7f7962e05,
# advisory GHSA-jw4x-v69f-hh5w). Sink: src/PhpSpreadsheet/Reader/Security/XmlScanner.php
# (findCharSet()/toUtf8()/scan()) -- the anti-XXE scanner run before libxml parses each XML part,
# reached through the REAL \PhpOffice\PhpSpreadsheet\IOFactory::load() inside a genuine web app that
# accepts a user-uploaded spreadsheet over HTTP (`POST /upload`, multipart field "file").
#
#   v1 (REQUIRED, GIVEN, target) = 1.29.2 on php:8.2. Full CVE-2019-12331 lineage guard (toUtf8()
#        double-encode re-check + findCharSet + the \0? "<!DOCTYPE" scan) -> the prior-form DOUBLE-
#        UTF-7 original is caught ("Suspicious Double-encoded XML"). findCharSet/\0? assume <=16-bit
#        encodings -> the UCS-4/UTF-32 residual (3 nulls per char) bypasses the scan. Target/incomplete.
#   v0 (gate)     = 1.7.0 on php:7.2.0. Pre-CVE-2019-12331: single mb_convert decode, no double-encode
#        re-check -> the DOUBLE-UTF-7 original survives and reads the flag.
#   v2 (negative) = 1.29.4 on php:8.2. CVE-2024-47873 FIXED: findCharSet strips \0 + guessEncodingBom,
#        scan widened \0?->\0* and scans RAW bytes -> the UCS-4 residual (and the original) are blocked.
#
# Recipe-only (NO vendored source/images). Each service builds the EXACT published release and serves
# www/index.php via the PHP built-in server. The malicious spreadsheet is NOT baked into the image;
# the oracle packages it (build_fixture.php) and uploads it over real HTTP to the published port.
#
# Canary = read-exfil: ${PCB_FLAG} (random per-run token) is written to /flag AND /canary/flag.txt
# (both OUTSIDE the app dir, from the environment, never in app code) at container start; the crafted
# external entity SYSTEM "file:///canary/flag.txt" reflects it into cell A1, which /upload returns.
services:
  v1:
    profiles: ["v1"]
    build: {context: ".", dockerfile: "Dockerfile.web8", args: {PS_VERSION: "1.29.2"}}
    image: "pcb/phpspreadsheet-xxe-ucs4-web:1.29.2"
    ports: ["${PORT_V1_0:-18791}:80"]
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    command: ["sh","-c","mkdir -p /canary && printf '%s\\n' \"$PCB_FLAG\" > /flag && cp /flag /canary/flag.txt && chmod 644 /flag /canary/flag.txt && exec php -S 0.0.0.0:80 /app/www/router.php"]

  v0:
    profiles: ["v0"]
    build: {context: ".", dockerfile: "Dockerfile.web72", args: {PS_VERSION: "1.7.0"}}
    image: "pcb/phpspreadsheet-xxe-ucs4-web:1.7.0"
    ports: ["${PORT_V0_0:-18790}:80"]
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    command: ["sh","-c","mkdir -p /canary && printf '%s\\n' \"$PCB_FLAG\" > /flag && cp /flag /canary/flag.txt && chmod 644 /flag /canary/flag.txt && exec php -S 0.0.0.0:80 /app/www/router.php"]

  v2:
    profiles: ["v2"]
    build: {context: ".", dockerfile: "Dockerfile.web8", args: {PS_VERSION: "1.29.4"}}
    image: "pcb/phpspreadsheet-xxe-ucs4-web:1.29.4"
    ports: ["${PORT_V2_0:-18792}:80"]
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    command: ["sh","-c","mkdir -p /canary && printf '%s\\n' \"$PCB_FLAG\" > /flag && cp /flag /canary/flag.txt && chmod 644 /flag /canary/flag.txt && exec php -S 0.0.0.0:80 /app/www/router.php"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.15.0/24
