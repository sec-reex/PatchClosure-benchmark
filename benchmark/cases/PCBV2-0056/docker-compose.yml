# PatchClosure-Bench recipe for astro-image-isremotepath  (REAL Astro over real HTTP; NOT source-lift).
# Pair: CVE-2025-55303 (V1 = incomplete-fix TARGET) -> CVE-2025-59837 (V2 = complete fix); V0 = pre-fix.
#
# Each server-vN is a REAL published Astro build: `npm i astro@<ASTRO_VER> @astrojs/node@9.4.4` +
# `astro build`, booted as the @astrojs/node standalone Node server. The SSRF is triggered by an
# EXTERNAL HTTP request to the server's REAL /_image endpoint; the oracle observes the ${PCB_FLAG}
# bytes proxied back from `internal-sidecar` when isRemotePath misclassifies the href.
#
# Canary hosts (Dockerfile.canary, edge.mjs) are the SSRF environment, present in every profile:
#   public-app       ROLE=public   allowlisted upstream (image.domains=['public-app']); benign body.
#   internal-sidecar ROLE=sidecar  serves ${PCB_FLAG}; NOT allowlisted, NO host port.
#
# Vector arithmetic (against the REAL transitive @astrojs/internal-helpers isRemotePath):
#   seed  //internal-sidecar/flag          V0 ih0.7.1 fetch->FLAG | V1 ih0.7.2 403 | V2 ih0.7.3 403
#   resid \\internal-sidecar\flag (%5C%5C) V1 ih0.7.2 fetch->FLAG | V2 ih0.7.3 403 (residual bypass of V1)
#   ctrl  http://public-app/img.png        lands on public-app (no flag) on ALL versions
services:
  public-app:
    profiles: ["v0", "v1", "v2"]
    build: { context: ., dockerfile: Dockerfile.canary }
    image: "pcb-astro-isremotepath:canary"
    environment:
      ROLE: "public"
      APP_PORT: "80"
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"

  internal-sidecar:
    profiles: ["v0", "v1", "v2"]
    build: { context: ., dockerfile: Dockerfile.canary }
    image: "pcb-astro-isremotepath:canary"
    environment:
      ROLE: "sidecar"
      APP_PORT: "80"
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"

  server-v0:
    profiles: ["v0"]
    build:
      context: .
      dockerfile: Dockerfile
      args: { ASTRO_VER: "5.13.1" }
    image: "pcb-astro-isremotepath:v0"
    depends_on: ["public-app", "internal-sidecar"]
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_SERVER_V0_0:-39750}:8080"]

  server-v1:
    profiles: ["v1"]
    build:
      context: .
      dockerfile: Dockerfile
      args: { ASTRO_VER: "5.13.4" }
    image: "pcb-astro-isremotepath:v1"
    depends_on: ["public-app", "internal-sidecar"]
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_SERVER_V1_0:-39751}:8080"]

  server-v2:
    profiles: ["v2"]
    build:
      context: .
      dockerfile: Dockerfile
      args: { ASTRO_VER: "5.13.10" }
    image: "pcb-astro-isremotepath:v2"
    depends_on: ["public-app", "internal-sidecar"]
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_SERVER_V2_0:-39752}:8080"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.57.0/24
