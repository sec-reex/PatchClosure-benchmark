services:
  v0:
    profiles: ["v0"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "20.14.0"
    image: nodefs-pcb-v0:latest
    container_name: pcb-nodefs-v0
    environment:
      PCB_FLAG: "${PCB_FLAG:?}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "$PCB_FLAG" > /flag.txt
        chmod 444 /flag.txt
        mkdir -p /tmp/allowed
        exec node --experimental-permission --allow-fs-read='*' --allow-fs-write=/tmp/allowed /app/server.js
    ports: ["${PORT_V0_0:-33770}:3000"]

  v1:
    profiles: ["v1"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
