case_id: PCBV2-0159
public_name: openremote-cve-2026-54640
run_mode: real-app-http
oracle_family: sibling_endpoint
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: docker_image
  repo: openremote/manager
  v0: "1.21.0"
  v1: "1.22.0"
service:
  # Compose publishes 127.0.0.1:${MGR_PORT}:8080. Platform must not probe :8000
  # (collector) or a stale :8080. start.sh waits until manager / or /auth answers
  # and admin token grant works.
  readiness: none
  exposed_ports: [8080]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
