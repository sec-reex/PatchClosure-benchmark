# PatchClosure-Bench recipe for froxlor-cve-2026-41231.
# Profiles:
#   v0 = Froxlor 2.0.11 (pre CVE-2023-6069: no symlink check in makeCorrectDir at all)
#   v1 = Froxlor 2.3.5  (6069 fix active in FTP/DirOptions/DirProtections/SubDomains;
#                        DataDump.add missed -> symlink escape open) <- target
#   v2 = Froxlor 2.3.6  (41231 fix: DataDump.add passes $fixed_homedir)
# Shared MariaDB. Seed channel: SubDomains.add dir-creation escape (HTTP 200 vs 404 on
# /seedout/newout/). Residual channel: DataDump.add symlink escape -> export tar.gz
# (containing the planted canary flag.txt) appears in the web root /dumpout/.
services:
  mysql:
    image: "mariadb:10.6"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "froxlor"
      MYSQL_USER: "froxlor"
      MYSQL_PASSWORD: "froxlor"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  v0:
    profiles: ["v0"]
    build: { context: ., args: { FROXLOR_REF: "2.0.11" } }
    image: "pcb-froxlor-sym:v0"
    container_name: "pcb-froxlor-sym-v0"
    environment:
      DB_HOST: "mysql"
      DB_DATABASE: "froxlor_v0"
      DB_USERNAME: "froxlor"
      DB_PASSWORD: "froxlor"
      DB_ROOT_PASSWORD: "root"
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG}"
    ports: ["${PORT_V0_0:-41830}:80"]
    volumes: ["appv0:/var/www/html"]
    depends_on:
      mysql: { condition: service_healthy }

  v1:
    profiles: ["v1"]
    build: { context: ., args: { FROXLOR_REF: "2.3.5" } }
    image: "pcb-froxlor-sym:v1"
    container_name: "pcb-froxlor-sym-v1"
    environment:
      DB_HOST: "mysql"
      DB_DATABASE: "froxlor_v1"
      DB_USERNAME: "froxlor"
      DB_PASSWORD: "froxlor"
      DB_ROOT_PASSWORD: "root"
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG}"
    ports: ["${PORT_V1_0:-41831}:80"]
    volumes: ["appv1:/var/www/html"]
    depends_on:
      mysql: { condition: service_healthy }

  v2:
    profiles: ["v2"]
    build: { context: ., args: { FROXLOR_REF: "2.3.6" } }
    image: "pcb-froxlor-sym:v2"
    container_name: "pcb-froxlor-sym-v2"
    environment:
      DB_HOST: "mysql"
      DB_DATABASE: "froxlor_v2"
      DB_USERNAME: "froxlor"
      DB_PASSWORD: "froxlor"
      DB_ROOT_PASSWORD: "root"
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG}"
    ports: ["${PORT_V2_0:-41832}:80"]
    volumes: ["appv2:/var/www/html"]
    depends_on:
      mysql: { condition: service_healthy }

volumes:
  appv0:
  appv1:
  appv2:
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.39.0/24
