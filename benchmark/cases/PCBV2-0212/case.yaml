case_id: PCBV2-0212
public_name: wegia-cve-2025-58745
run_mode: real-app-http
oracle_family: read_exfil
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: git
  repo: https://github.com/LabRedesCefetRJ/WeGIA.git
  v0: 3.4.10
  v1: 3.4.10
service:
  # Compose publishes ${PORT_V*_0}:80. start.sh waits for html/login.php.
  # Platform must not HTTP-probe host :80 (Apache is not up until SQL import finishes).
  readiness: none
  exposed_ports: [80]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
