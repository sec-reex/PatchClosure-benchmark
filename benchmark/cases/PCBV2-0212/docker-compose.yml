# PatchClosure-Bench env for wegia-cve-2025-58745  (CVE-2025-22133 -> CVE-2025-58745).
# WeGIA (PHP web manager for charitable/NGO institutions). Source git-cloned at BUILD time.
#   V0 = WeGIA 3.4.10, CVE-2025-22133 finfo Excel-MIME guard neutralised -> pre-fix state (seed reaches flag)
#   V1 = WeGIA 3.4.10 stock (Excel-MIME guard present)                   -> seed blocked; CVE-2025-58745 residual reaches flag   <- TARGET
#   V2 = WeGIA 3.4.11 stock (controla_xlsx.php upload endpoint DELETED)  -> residual blocked (CVE-2025-58745 fixed)
# Canary (rce): ${PCB_FLAG} planted at /flag/pcb_flag.txt OUTSIDE docroot; only an executed uploaded PHP echoes it.
x-db: &db
  image: "mariadb:10.11"
  environment:
    MARIADB_ROOT_PASSWORD: rootpass
    MARIADB_DATABASE: wegia
    MARIADB_USER: wegia
    MARIADB_PASSWORD: wegiapass
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 5s
    timeout: 5s
    retries: 40

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  environment: &app-env
    PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    DB_HOST: "db"
    DB_NAME: "wegia"
    DB_USER: "wegia"
    DB_PASS: "wegiapass"
    DB_ROOT_PASS: "rootpass"
  healthcheck:
    test: ["CMD", "sh", "-c", "test -f /flag/pcb_flag.txt && curl -fsS http://127.0.0.1/html/login.php >/dev/null 2>&1"]
    interval: 5s
    timeout: 5s
    retries: 60

services:
  db-v0:
    <<: *db
    profiles: ["v0"]
  v0:
    <<: *app
    profiles: ["v0"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {WEGIA_REF: "3.4.10"}
    depends_on:
      db-v0: {condition: service_healthy}
    ports: ["${PORT_V0_0:-39480}:80"]
    environment:
      <<: *app-env
      DB_HOST: "db-v0"
      NEUTRALISE_MIME_GUARD: "1"

  db-v1:
    <<: *db
    profiles: ["v1"]
  v1:
    <<: *app
    profiles: ["v1"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {WEGIA_REF: "3.4.10"}
    depends_on:
      db-v1: {condition: service_healthy}
    ports: ["${PORT_V1_0:-39481}:80"]
    environment:
      <<: *app-env
      DB_HOST: "db-v1"
      NEUTRALISE_MIME_GUARD: "0"

  db-v2:
    <<: *db
    profiles: ["v2"]
  v2:
    <<: *app
    profiles: ["v2"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {WEGIA_REF: "3.4.11"}
    depends_on:
      db-v2: {condition: service_healthy}
    ports: ["${PORT_V2_0:-39482}:80"]
    environment:
      <<: *app-env
      DB_HOST: "db-v2"
      NEUTRALISE_MIME_GUARD: "0"
