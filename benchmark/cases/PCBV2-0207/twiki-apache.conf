<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/twiki

    ScriptAlias /bin/ "/var/www/twiki/bin/"
    <Directory "/var/www/twiki/bin">
        AllowOverride None
        Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
        SetHandler cgi-script
        Require all granted
    </Directory>

    Alias /pub/ "/var/www/twiki/pub/"
    <Directory "/var/www/twiki/pub">
        AllowOverride None
        Options +FollowSymLinks
        Require all granted
    </Directory>

    <Directory "/var/www/twiki/data">
        Require all denied
    </Directory>
    <Directory "/var/www/twiki/lib">
        Require all denied
    </Directory>

    ErrorLog /var/log/apache2/twiki_error.log
    CustomLog /var/log/apache2/twiki_access.log combined
</VirtualHost>
