# LocalSite.cfg -- the site configuration bin/configure would generate.
# Overrides the defaults in lib/TWiki.spec. Committed as TEXT only; no TWiki tree
# is committed (the real TWiki bin/lib is fetched + configured at build time).

# --- paths / URLs -------------------------------------------------------------
$TWiki::cfg{DefaultUrlHost}  = 'http://127.0.0.1';
# Host ports are assigned dynamically (${PORT_V*_0}); permit loopback hosts so
# TWiki's post-save redirect is not rejected as an unsafe host.
$TWiki::cfg{PermittedRedirectHostUrls} = 'http://127.0.0.1, http://localhost';
$TWiki::cfg{ScriptUrlPath}   = '/bin';
$TWiki::cfg{ScriptSuffix}    = '';
$TWiki::cfg{PubUrlPath}      = '/pub';
$TWiki::cfg{PubDir}          = '/var/www/twiki/pub';
$TWiki::cfg{TemplateDir}     = '/var/www/twiki/templates';
$TWiki::cfg{DataDir}         = '/var/www/twiki/data';
$TWiki::cfg{LocalesDir}      = '/var/www/twiki/locale';
$TWiki::cfg{WorkingDir}      = '/var/www/twiki/working';
$TWiki::cfg{TempfileDir}     = '/tmp';
$TWiki::cfg{SafeEnvPath}     = '/bin:/usr/bin';

# --- store: RcsLite = pure-Perl, needs no external rcs/ci/co binaries ----------
$TWiki::cfg{StoreImpl}            = 'RcsLite';
$TWiki::cfg{Store}{Implementation}= 'TWiki::Store::RcsLite';
$TWiki::cfg{RCS}{AutoAttachPubFiles} = 0;

# --- auth: sessions + template login + htpasswd (plain), login name == WikiName -
$TWiki::cfg{LoginManager}     = 'TWiki::LoginManager::TemplateLogin';
$TWiki::cfg{PasswordManager}  = 'TWiki::Users::HtPasswdUser';
$TWiki::cfg{Htpasswd}{Encoding} = 'plain';
$TWiki::cfg{UseClientSessions}  = 1;
$TWiki::cfg{Sessions}{UseIPMatching} = 0;
$TWiki::cfg{Register}{AllowLoginName} = 0;
$TWiki::cfg{Register}{EnableNewUserRegistration} = 0;
$TWiki::cfg{Register}{NeedVerification} = 0;

# --- keep the surface minimal & deterministic ---------------------------------
$TWiki::cfg{DisableAllPlugins} = 1;
$TWiki::cfg{EnableEmail}       = 0;
$TWiki::cfg{Log}{Action}{view} = 0;
$TWiki::cfg{WarningFileName}   = '/var/www/twiki/working/warn.txt';
$TWiki::cfg{LogFileName}       = '/var/www/twiki/working/log.txt';
$TWiki::cfg{DebugFileName}     = '/var/www/twiki/working/debug.txt';

# NOTE: {CryptToken}{Enable} and {CryptToken}{SecureActions} are deliberately NOT
# set here -- for 4.3.2 (v2) the TWiki.spec defaults (Enable=1, SecureActions
# includes 'save') apply, so v2 enforces the crypt-token guard exactly as a stock
# 4.3.2 install does. 4.3.0/4.3.1 (v0/v1) have no CryptToken code at all.

1;
