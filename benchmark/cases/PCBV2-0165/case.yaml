case_id: PCBV2-0165
public_name: pgadmin-cve-2026-17348
run_mode: real-app-http
oracle_family: state_auth_mutation
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: docker_image
  repo: dpage/pgadmin4
  v0: "9.15"
  v1: "9.16"
service:
  # dpage/pgadmin4 publishes ${PORT_V*_0}:80 — host :80 is not bound.
  # start.sh waits until GET /login answers; platform must not TCP-probe :80.
  readiness: none
  exposed_ports: [80]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
