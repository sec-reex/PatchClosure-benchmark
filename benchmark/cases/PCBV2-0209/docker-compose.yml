# PatchClosure-Bench recipe for undertow-jboss-wildfly-web-server-cve-2018-1067
# (CVE-2016-4993 -> CVE-2018-1067, Undertow HTTP response splitting / CRLF header injection,
#  CWE-113). Genuine incomplete-fix pair; NOT same-release.
#
# Faithful-core, recipe-only (NO vendored jars/images). Each version service builds from the shared
# Dockerfile, which pulls the EXACT published io.undertow:undertow-core:${UNDERTOW_VERSION} from
# Maven Central and runs the REAL, unmodified Undertow response encoder via ReflectServer.java.
#
# The Undertow server binds 0.0.0.0:8080 in the container and is PUBLISHED to a host port. The
# oracle triggers it EXTERNALLY: a raw TCP socket from the host to the published port sends one
# crafted GET /reflect?v=... whose reflected value carries the CRLF payload. Whether the response
# splits is decided ENTIRELY by the version's own unmodified HttpResponseConduit.writeString guard.
#
# Profiles:
#   v1 (REQUIRED, GIVEN, target) = undertow-core 1.4.3.Final = the CVE-2016-4993 fix. Its
#        HttpResponseConduit.writeString now drops the char '\r'/'\n', so a plain CRLF in a reflected
#        header value is BLOCKED (seed). But the check is CHAR-based:
#        `if(c != '\r' && c != '\n') buffer.put((byte) c);` -- a char like U+010D whose low byte
#        narrows to 0x0D passes the check and writes a REAL CR/LF onto the wire -> the response still
#        splits (residual REACHES on V1). The target.  Published host port 39734.
#   v0 (gate)     = undertow-core 1.4.2.Final = pre-CVE-2016-4993. writeString is
#        `buffer.put((byte) string.charAt(i));` with NO check -> a plain CRLF splits the response.
#        Published host port 39733.
#   v2 (negative) = undertow-core 1.4.25.Final = the CVE-2018-1067 fix (commit 85d4478). writeString
#        narrows to a byte FIRST: `byte b=(byte)c; if(b != '\r' && b != '\n') buffer.put(b);` -> the
#        truncating-char CR/LF is caught and the residual is BLOCKED.  Published host port 39735.
#
# Canary = a genuinely CRLF-framed injected "X-Split" header observed on the wire by the host-side
# raw-socket detector in oracle.py. ${PCB_FLAG} (planted only in the container env, absent from
# source and from the request bytes) is the per-run answer key the oracle releases ONLY when a real
# 0x0D 0x0A pair split the response past the version's writeString guard. No gadget / code execution.
services:
  v1:
    profiles: ["v1"]
    build: {context: ".", dockerfile: "Dockerfile", args: {UNDERTOW_VERSION: "1.4.3.Final"}}
    image: "pcb/undertow-crlf:1.4.3.Final"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V1_0:-39734}:8080"]

  v0:
    profiles: ["v0"]
    build: {context: ".", dockerfile: "Dockerfile", args: {UNDERTOW_VERSION: "1.4.2.Final"}}
    image: "pcb/undertow-crlf:1.4.2.Final"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V0_0:-39733}:8080"]

  v2:
    profiles: ["v2"]
    build: {context: ".", dockerfile: "Dockerfile", args: {UNDERTOW_VERSION: "1.4.25.Final"}}
    image: "pcb/undertow-crlf:1.4.25.Final"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V2_0:-39735}:8080"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.210.0/24
