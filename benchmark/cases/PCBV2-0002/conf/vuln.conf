# Permissive overlay that exposes the path-canonicalization boundary on a real
# service entrypoint. This is NOT a default production config; it is the
# controlled misconfig (Alias + Require all granted, mod_cgi on) under which
# CVE-2021-41773 / CVE-2021-42013 are reachable, matching vulhub's httpd cases.
#
# NOTE: no application/business code is modified. The canary file is planted in
# the ENVIRONMENT by the compose entrypoint (see docker-compose.yml), not here.

# 1) An alias whose target directory is traversable.
Alias /pub/ "/usr/local/apache2/htdocs/"
<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# 2) Grant read on the filesystem root so the traversal target (the planted
#    canary at /canary.txt, which the DocumentRoot cannot serve normally) is
#    reachable once the guard is bypassed. This overrides the default
#    "<Directory /> Require all denied" because it appears later in the config.
<Directory "/">
    Require all granted
</Directory>

# 3) Enable mod_cgi + a script alias (the RCE surface of the same traversal;
#    kept on for parity with vulhub, file-read canary is the primary oracle).
LoadModule cgid_module modules/mod_cgid.so
ScriptAlias /cgi-bin/ "/usr/local/apache2/cgi-bin/"
<Directory "/usr/local/apache2/cgi-bin">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>
