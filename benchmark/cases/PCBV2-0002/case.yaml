case_id: PCBV2-0002
public_name: apache-http-server-cve-2021-42013
run_mode: real-app-http
oracle_family: read_exfil
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: git
  repo: https://github.com/apache/httpd.git
  v0: 2.4.49
  v1: 2.4.50
service:
  # Compose publishes ${PORT_V*_0}:80. Platform HTTP on host :80 would miss
  # the randomized port; start.sh / reset.sh wait on the published host port.
  readiness: none
  exposed_ports: [80]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
