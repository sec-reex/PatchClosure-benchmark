case_id: PCBV2-0195
public_name: siyuan-double-url-encode-assets-traversal
run_mode: real-app-http
oracle_family: read_exfil
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: docker_image
  repo: b3log/siyuan
  v0: v3.6.4
  v1: v3.6.5
service:
  # Host bind is ${PORT_V*_0}:6806. Platform HTTP on host :6806 would miss.
  # start.sh / reset.sh / verify.sh wait on the published /assets/logo.png.
  readiness: none
  exposed_ports: [6806]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
