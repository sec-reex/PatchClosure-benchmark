case_id: PCBV2-0001
public_name: jetty-uri-canonicalize-before-authz-webinf
run_mode: real-app-http
oracle_family: read_exfil
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  # Official library/jetty images (not a git clone). Tags match compose and
  # CVE-2021-28164: 9.4.38.v20210224 affected; 9.4.39.v20210325 patched
  # (CVE-2021-34429 residual still open until 9.4.43).
  type: docker_image
  repo: jetty
  v0: "9.4.38-jre8"
  v1: "9.4.39-jre8"
service:
  # Compose publishes ${PORT_V*_0}:8080. Platform HTTP on host :8080 would miss
  # the randomized port; start.sh / reset.sh wait on the published host port.
  readiness: none
  exposed_ports: [8080]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
