# PatchClosure-Bench recipe for grafana-cve-2021-43813.
# Recipe-based (vulhub-style): NO committed images / source. Official grafana-oss
# images are pulled at `up` time; only small text files live in this dir.
#
# Profiles:
#   v1 (REQUIRED, GIVEN, attackable) = grafana-oss:8.3.1 -> CVE-2021-43798 patched,
#        but the sibling markdown-endpoint traversal CVE-2021-43813 is still open
#        (the residual the system attacks).
#   v0 (optional, held-out gate)     = grafana-oss:8.3.0 -> vulnerable to CVE-2021-43798.
#   v2 (optional, held-out negative) = grafana-oss:8.3.2 -> 43813 also fixed.
#
# The canary (a random per-run token) is planted at /tmp/pcb_canary.md by the
# entrypoint from ${PCB_FLAG}. It sits OUTSIDE every Grafana-served root (public/
# assets and plugin dirs) so it can only be read via a successful traversal.
# It is a .md file because CVE-2021-43813 appends ".md" to the requested name.
# No app/business code is touched. admin/admin is set so the authenticated
# markdown endpoint (43813) is reachable via HTTP basic auth.
x-grafana-boot: &boot
  entrypoint:
    - /bin/sh
    - -c
    - |
      printf '%s' "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}" > /tmp/pcb_canary.md
      chmod 644 /tmp/pcb_canary.md
      exec /run.sh
  environment:
    GF_SECURITY_ADMIN_USER: "admin"
    GF_SECURITY_ADMIN_PASSWORD: "admin"
    PCB_FLAG: "${PCB_FLAG}"
  healthcheck:
    test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || true; exit 0"]
    interval: 3s
    timeout: 3s
    retries: 10

services:
  v1:
    <<: *boot
    profiles: ["v1"]
    image: "grafana/grafana-oss:8.3.1"
    pull_policy: missing
    ports: ["${PORT_V1_0:-34331}:3000"]

  v0:
    <<: *boot
    profiles: ["v0"]
    image: "grafana/grafana-oss:8.3.0"
    pull_policy: missing
    ports: ["${PORT_V0_0:-34330}:3000"]

  v2:
    <<: *boot
    profiles: ["v2"]
    image: "grafana/grafana-oss:8.3.2"
    pull_policy: missing
    ports: ["${PORT_V2_0:-34332}:3000"]

# No pinned subnet: leftover pcb_run_* networks collide under parallel workers.
