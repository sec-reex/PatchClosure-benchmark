; Production-standard error handling for the real TestLink app image.
; TestLink calls error_reporting(E_ALL); on PHP 7.4 the legacy 1.9.19 code emits E_WARNING/E_DEPRECATED
; notices from config.inc.php BEFORE session_start(). With display_errors=On (php:cli/apache dev
; default) that text is written to the response, triggering "headers already sent" so the PHPSESSID
; cookie is never set and login can never persist. display_errors=Off (the production default) sends
; those notices to the error log instead, so headers stay clean and the REAL login/session works.
; This does NOT touch any TestLink code or the reqURI sink -- it only stops warning text from
; corrupting the HTTP headers.
display_errors = Off
log_errors = On
