# PatchClosure-Bench recipe: n8n expression-sandbox escape incomplete-fix pair.
#   CVE-2025-68613 (n8n 1.122.0 / n8n-workflow 1.119.0: FunctionThisSanitizer)
#   -> CVE-2026-25049 (n8n 1.123.17 / n8n-workflow 1.120.7: ThisSanitizer +
#      PrototypeSanitizer.visitObjectPattern)
#
# Each profile builds node:20-slim + a PINNED n8n-workflow version (build-arg).
# n8n release tag -> bundled n8n-workflow npm version:
#   v0 = n8n 1.119.1  -> n8n-workflow 1.116.0  (pre-CVE-2025-68613: NO FunctionThisSanitizer;
#        a regular-function `this` binds to the Node global -> reach real process/Function)
#   v1 = n8n 1.122.0  -> n8n-workflow 1.119.0  (CVE-2025-68613 fixed: FunctionThisSanitizer
#        rewrites IIFE `.call({process:{}})` / callback `.bind({process:{}})`, so the
#        this-binding escape is blocked. BUT PrototypeSanitizer has NO visitObjectPattern,
#        so a DESTRUCTURING escape via `const {[`constructor`]:F}=...` reaches the Function
#        constructor -> CVE-2026-25049 residual)  <-- THE TARGET
#   v2 = n8n 1.123.17 -> n8n-workflow 1.120.7  (CVE-2026-25049 fixed: PrototypeSanitizer
#        gains visitObjectPattern -- computed/TemplateLiteral destructuring keys throw
#        ExpressionComputedDestructuringError; unsafe string/identifier keys throw
#        ExpressionDestructuringError; ThisSanitizer also neutralises `this`/globalThis)
#
# The canary (${PCB_FLAG}) is injected via the container ENVIRONMENT and planted by the
# entrypoint in /canary/flag.txt -- NOT on the sandbox data context and NOT in app code.
# Only an expression that escapes the real n8n sandbox to the real `process` / Function
# constructor can surface it. No app/business code is modified; only the untrusted
# EXPRESSION (the probe) varies.
x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"

services:
  v0:
    <<: *common
    profiles: ["v0"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NW_VERSION: "1.116.0"
    image: pcb-n8n-expr-25049-v0
    ports: ["${PORT_V0_0:-39730}:8080"]

  v1:
    <<: *common
    profiles: ["v1"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NW_VERSION: "1.119.0"
    image: pcb-n8n-expr-25049-v1
    ports: ["${PORT_V1_0:-39731}:8080"]

  v2:
    <<: *common
    profiles: ["v2"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NW_VERSION: "1.120.7"
    image: pcb-n8n-expr-25049-v2
    ports: ["${PORT_V2_0:-39732}:8080"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.202.0/24
