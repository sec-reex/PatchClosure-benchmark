# Serve Majordomo 2's installed CGI programs at /cgi-bin/.
# Apache itself runs as the majordom user/group (set in envvars) so the
# mj_wwwusr script's baked-in `die unless $> == UID` check passes without
# setuid wrappers.
ScriptAlias /cgi-bin/ /usr/local/majordomo/cgi-bin/
<Directory /usr/local/majordomo/cgi-bin/>
  AllowOverride None
  Options +ExecCGI
  Require all granted
</Directory>
# Modern perl dropped '.' from @INC; Majordomo's 2011 code uses relative
# requires, so the CGI needs this legacy behaviour re-enabled.
PassEnv PERL_USE_UNSAFE_INC
