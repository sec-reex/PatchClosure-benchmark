case_id: PCBV2-0080
public_name: arcadedb-cve-2026-54076
run_mode: real-app-http
oracle_family: state_auth_mutation
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: docker_image
  repo: arcadedata/arcadedb
  v0: "26.3.2"
  v1: "26.4.2"
service:
  # Host port is ${PORT_V*_0}, not :2480. start.sh waits on the published port.
  readiness: none
  exposed_ports: [2480]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
  wrong_flag_mode: residual  # seed 通道=schema 状态变更（与 flag 值无关），wrong 拒绝走 residual
