case_id: PCBV2-0054
public_name: apache-dubbo-serializer-switch-cve-2021-25641
run_mode: real-app-tcp
oracle_family: tcp_cli_extension
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: git
  repo: https://github.com/apache/dubbo.git
  v0: 2.7.6
  v1: 2.7.8
service:
  # Compose publishes ${PORT_V*_0}:20880. Platform TCP on host :20880 would miss;
  # start.sh / reset.sh wait on the published host port.
  readiness: none
  exposed_ports: [20880]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
