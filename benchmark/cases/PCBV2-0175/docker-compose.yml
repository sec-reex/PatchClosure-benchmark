# PatchClosure-Bench recipe for pp2-deep-get-set (CVE-2020-7715 -> CVE-2022-21231).
# run_mode = real-app-http. Each profile builds an image that npm-installs the REAL published
# `deep-get-set` release (per DGS_VER build-arg) and boots a REAL Express service (app/server.js) that
# assigns attacker JSON via deep-get-set's deep(obj, path, value) set form -- exactly how a real app
# writes user-supplied JSON into fresh state. Prototype pollution is triggered EXTERNALLY over HTTP:
#   POST /set {path,value}  -> service calls the real deep({}, path, value) on it (may pollute Object.prototype)
#   GET  /check             -> reflects ${PCB_FLAG} iff a fresh object now inherits isAdmin===true
# The pollution persists process-wide (that IS the vuln); the oracle restarts a service (fresh node
# process => clean Object.prototype) between the seed and the residual payloads and between versions
# so probes never leak into each other.
#
# Vector arithmetic against deep({}, path, value):
#   - original/seed (CVE-2020-7715):  path=["__proto__","isAdmin"], value=true
#       V0 (1.1.0, no guard):     walks onto Object.prototype -> isAdmin=true -> /check emits FLAG.
#       V1 (1.1.1):               isSafeKey('__proto__') is false -> `if (!isSafeKey(key)) return` -> BLOCKED.
#   - residual (CVE-2022-21231):       path=[["__proto__"],"isAdmin"], value=true
#       V1 (1.1.1): key ["__proto__"] !== '__proto__' (array vs string) so isSafeKey returns true and
#                   the guard passes it, then obj[["__proto__"]] coerces to '__proto__' -> pollutes -> FLAG.
#       V2 (1.1.2): isUnsafeKey matches (Array.isArray(key) && key[0]==='__proto__') FIRST -> return
#                   before any write -> BLOCKED.
#
# Profiles: v1 (REQUIRED, GIVEN target)=1.1.1; v0 (held-out seed env)=1.1.0; v2 (held-out neg)=1.1.2.
services:
  v1:
    build:
      context: .
      args:
        DGS_VER: "1.1.1"
    image: "pcb-deep-get-set:1.1.1"
    profiles: ["v1"]
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG}"
      DGS_VER: "1.1.1"
    ports: ["${PORT_V1_0:-39862}:8080"]

  v0:
    build:
      context: .
      args:
        DGS_VER: "1.1.0"
    image: "pcb-deep-get-set:1.1.0"
    profiles: ["v0"]
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG}"
      DGS_VER: "1.1.0"
    ports: ["${PORT_V0_0:-39861}:8080"]

  v2:
    build:
      context: .
      args:
        DGS_VER: "1.1.2"
    image: "pcb-deep-get-set:1.1.2"
    profiles: ["v2"]
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG}"
      DGS_VER: "1.1.2"
    ports: ["${PORT_V2_0:-39863}:8080"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.176.0/24
