; Pre-seeded Gitea config for PatchClosure-Bench case
; gitea-openredirect-2022-1058-2026-25779 (CVE-2022-1058 -> CVE-2026-25779).
; SQLite backend, INSTALL_LOCK=true so the web installer is skipped and Gitea
; boots straight into the login flow. SECRET_KEY / INTERNAL_TOKEN are pinned so
; Gitea never needs to rewrite this file at boot. This is ENVIRONMENT config
; only -- no Gitea source is copied into the case.
APP_NAME = PCB-Gitea
RUN_MODE = prod
RUN_USER = git
WORK_PATH = /data/gitea

[server]
PROTOCOL         = http
HTTP_ADDR        = 0.0.0.0
HTTP_PORT        = 3000
; AppURL (site origin). The attacker redirect host <FLAG>.evil.example is
; off-origin relative to this, so an emitted Location to that host = open redirect.
ROOT_URL         = http://localhost:3000/
DOMAIN           = localhost
DISABLE_SSH      = true
OFFLINE_MODE     = true
LFS_START_SERVER = false

[database]
DB_TYPE = sqlite3
PATH    = /data/gitea/gitea.db
LOG_SQL = false

[security]
INSTALL_LOCK   = true
SECRET_KEY     = TMAmyUWyMeGj8ZgL1EIHZmq02wwUBGqkeqD90e7ssZIogISmKfE71SVolLB7YHA6
INTERNAL_TOKEN = eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYmYiOjE3ODQxMzUxMjZ9.C0DzOTe9nmYarF09_SAqzdUhLY6Cluq9GconZXKLvE8
PASSWORD_HASH_ALGO = pbkdf2

[oauth2]
; Pinned so newer Gitea (1.26.0) never needs to generate + persist it at boot
; (which would fail against the read-only app.ini mount). Ignored by 1.16.x.
JWT_SECRET = dP991H1oUQYZq-QDZodlMIJz7piH0C8ixCVCxLYi2wg

[service]
DISABLE_REGISTRATION            = true
REQUIRE_SIGNIN_VIEW             = false
ENABLE_NOTIFY_MAIL             = false
DEFAULT_KEEP_EMAIL_PRIVATE      = false
ENABLE_CAPTCHA                  = false

[repository]
ROOT = /data/git/repositories

[log]
MODE  = console
LEVEL = warn

[cron]
ENABLED = false

[migrations]
; no outbound migrations needed
ALLOW_LOCALNETWORKS = false

[mailer]
ENABLED = false
