case_id: PCBV2-0182
public_name: rails_html_sanitizer_select_style
run_mode: real-app-http
oracle_family: browser_xss
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  # Runtime gem-installs the published rails-html-sanitizer (1.4.2 / 1.4.3).
  type: url_tgz
  repo: https://rubygems.org/gems/rails-html-sanitizer
  v0: "1.4.2"
  v1: "1.4.3"
service:
  # Compose publishes ${PORT_*_0}:80/8070/9000. Platform HTTP on :80 would miss.
  # start.sh / reset.sh wait until app :80, victim :8070, callback :9000 answer.
  readiness: none
  exposed_ports: [80, 8070, 9000]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
