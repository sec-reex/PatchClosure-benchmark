  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: git
  repo: https://github.com/openstack/nova.git
  v0: a90bd50887c45de1e1ee3cb4f0901ae62fcf9bfd
