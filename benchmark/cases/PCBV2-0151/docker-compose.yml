# PatchClosure-Bench case: new-api SSRF incomplete-fix (CVE-2025-59146 -> CVE-2025-62155)
#
# REAL official calciumion/new-api images (whole product, SQLite). Two sidecars:
#   - attacker : "public" IP 11.11.11.10 (NOT in new-api's private blocklist),
#                :8080 (default-allowed port), 302-redirects to the canary.
#   - canary   : "internal" IP 172.31.9.9 (private 172.16/12), :80,
#                NO published host port -> reachable only via SSRF from new-api.
#
# Oracle drives POST /v1/chat/completions (image_url) and reads the canary hit
# log via `docker compose exec`. Do not flatten these IPAM pools to a default bridge.

networks:
  pub:
    driver: bridge
    ipam:
      config:
        - subnet: 11.11.11.0/24
  intranet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.9.0/24

services:
  attacker:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./sidecars:/app:ro
    environment:
      - REDIRECT_TARGET=http://172.31.9.9:80/internal-secret.png
    command: ["python", "/app/attacker.py"]
    networks:
      pub:
        ipv4_address: 11.11.11.10

  canary:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./sidecars:/app:ro
    environment:
      - PCB_FLAG=${PCB_FLAG:-PCB_FLAG_UNSET}
    command: ["python", "/app/canary.py"]
    networks:
      intranet:
        ipv4_address: 172.31.9.9

  newapi-v0:
    image: calciumion/new-api:v0.9.0.4
    profiles: ["v0"]
    restart: unless-stopped
    ports:
      - "${PORT_V0_0:-3010}:3000"
    environment:
      - TZ=UTC
      - GET_MEDIA_TOKEN=true
      - GET_MEDIA_TOKEN_NOT_STREAM=true
      - ERROR_LOG_ENABLED=true
    networks:
      - pub
      - intranet
    depends_on: [attacker, canary]

  newapi-v1:
    image: calciumion/new-api:v0.9.0.5
    profiles: ["v1"]
    restart: unless-stopped
    ports:
      - "${PORT_V1_0:-3011}:3000"
    environment:
      - TZ=UTC
      - GET_MEDIA_TOKEN=true
      - GET_MEDIA_TOKEN_NOT_STREAM=true
      - ERROR_LOG_ENABLED=true
    networks:
      - pub
      - intranet
    depends_on: [attacker, canary]

  newapi-v2:
    image: calciumion/new-api:v0.9.6
    profiles: ["v2"]
    restart: unless-stopped
    ports:
      - "${PORT_V2_0:-3012}:3000"
    environment:
      - TZ=UTC
      - GET_MEDIA_TOKEN=true
      - GET_MEDIA_TOKEN_NOT_STREAM=true
      - ERROR_LOG_ENABLED=true
    networks:
      - pub
      - intranet
    depends_on: [attacker, canary]
