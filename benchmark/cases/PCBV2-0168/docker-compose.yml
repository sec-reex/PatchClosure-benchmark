# PatchClosure-Bench recipe for php-interpreter-cve-2024-2756
# Pair: CVE-2022-31629 (V1, incomplete fix = TARGET) -> CVE-2024-2756 (V2, complete fix).
#
# SINK: main/php_variables.c :: php_register_variable_ex() cookie/variable NAME
# mangling. PHP replaces '.', ' ' and (via the unclosed-'[' array path) restores
# '[' -> '_' in $_COOKIE names, letting a non-"__Host-" raw cookie name collide
# with the protected "__Host-flag" slot, defeating the browser cookie-prefix rule.
#
# Recipe-based: official php:<point-release>-cli images pulled at fetch/up-time; the
# tiny reflector app is bind-mounted read-only. NO canary planted in the container --
# the "flag" is the attacker-injected cookie VALUE (${PCB_FLAG}) supplied by the
# probe; the oracle detects it in the reflected protected slot.
#
# Profiles / roles:
#   v0 = php 8.1.10  (pre-CVE-2022-31629: no forbidden-name check; '..Host-' collides)
#   v1 = php 8.1.11  (CVE-2022-31629 fixed via early __Host-/__Secure- check, but the
#                     check runs BEFORE the '[' array path -> '_[Host-' still collides)  [TARGET]
#   v2 = php 8.1.28  (CVE-2024-2756 fixed: check moved into php_is_forbidden_variable_name
#                     at the plain_var insertion point -> '_[Host-' also blocked)
x-php: &php
  restart: "no"
  volumes:
    - ./app:/app:ro
  command: ["php", "-S", "0.0.0.0:80", "-t", "/app"]
  healthcheck:
    test: ["CMD", "sh", "-c", "php -r 'exit(@file_get_contents(\"http://127.0.0.1:80/\")===false?1:0);'"]
    interval: 3s
    timeout: 3s
    retries: 10

services:
  v0:
    <<: *php
    profiles: ["v0"]
    image: "php:8.1.10-cli"
    ports: ["${PORT_V0_0:-39810}:80"]

  v1:
    <<: *php
    profiles: ["v1"]
    image: "php:8.1.11-cli"
    ports: ["${PORT_V1_0:-39811}:80"]

  v2:
    <<: *php
    profiles: ["v2"]
    image: "php:8.1.28-cli"
    ports: ["${PORT_V2_0:-39828}:80"]
