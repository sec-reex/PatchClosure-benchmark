# PatchClosure-Bench env: glpi-search-constructsql-sqli
#   CVE-2024-27096 (original)  ->  CVE-2024-31456 (residual / incomplete fix)
# GLPI search SELECT-alias SQLi via the `sort` param -> Search::addSelect (ITEM_<type>_<ID> alias).
#   V0 = GLPI 10.0.12  : Search::manageParams does NOT int-cast `sort` -> /ajax/search.php injectable
#   V1 = GLPI 10.0.14  : manageParams int-casts `sort` (CVE-2024-27096 fix) -> search path BLOCKED,
#                        but /ajax/map.php calls prepareDatasForSearch WITHOUT manageParams -> STILL injectable
#   V2 = GLPI 10.0.15  : Search::cleanParams() inside prepareDatasForSearch -> map.php path BLOCKED
# Canary: ${PCB_FLAG} planted in restricted table `pcb_canary`; leaked via DEBUG-mode SQL errors.
x-db: &db
  image: "mariadb:10.11"
  environment:
    MARIADB_DATABASE: glpi
    MARIADB_USER: glpi
    MARIADB_PASSWORD: glpipass
    MARIADB_ROOT_PASSWORD: rootpass
  healthcheck:
    test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
    interval: 5s
    timeout: 5s
    retries: 40

x-app-env: &app-env
  PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
  DB_NAME: "glpi"
  DB_USER: "glpi"
  DB_PASS: "glpipass"

services:
  db-v0:
    <<: *db
    profiles: ["v0"]
  v0:
    build: { context: ., dockerfile: Dockerfile, args: { GLPI_VER: "10.0.12" } }
    profiles: ["v0"]
    depends_on: { db-v0: { condition: service_healthy } }
    ports: ["${PORT_V0_0:-39820}:80"]
    environment:
      <<: *app-env
      DB_HOST: "db-v0"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/pcb_ready && curl -sf http://127.0.0.1/index.php >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 600s
      retries: 60

  db-v1:
    <<: *db
    profiles: ["v1"]
  v1:
    build: { context: ., dockerfile: Dockerfile, args: { GLPI_VER: "10.0.14" } }
    profiles: ["v1"]
    depends_on: { db-v1: { condition: service_healthy } }
    ports: ["${PORT_V1_0:-39821}:80"]
    environment:
      <<: *app-env
      DB_HOST: "db-v1"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/pcb_ready && curl -sf http://127.0.0.1/index.php >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 600s
      retries: 60

  db-v2:
    <<: *db
    profiles: ["v2"]
  v2:
    build: { context: ., dockerfile: Dockerfile, args: { GLPI_VER: "10.0.15" } }
    profiles: ["v2"]
    depends_on: { db-v2: { condition: service_healthy } }
    ports: ["${PORT_V2_0:-39822}:80"]
    environment:
      <<: *app-env
      DB_HOST: "db-v2"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/pcb_ready && curl -sf http://127.0.0.1/index.php >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 600s
      retries: 60

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.119.0/24
