ServerRoot "/usr/local/apache2"
ServerName localhost
PidFile logs/httpd.pid
User daemon
Group daemon
DocumentRoot "/usr/local/apache2/htdocs"

Listen 80
Listen 8080

<Directory />
    Order deny,allow
    Deny from all
</Directory>
<Directory "/usr/local/apache2/htdocs">
    Order allow,deny
    Allow from all
</Directory>

# Two reverse-proxy front-ends onto the SAME mod_proxy routing sink. Both use the
# classic mis-configuration (no '/' between the intended backend authority and the
# request-URI), so a request-target beginning with "@sidecar/" is expanded into
# http://legit-backend@sidecar/ -> legit-backend degrades to userinfo and the
# internal-only host `sidecar` becomes the real proxy target (SSRF, CWE-918).
ProxyRequests Off
<Proxy *>
    Order deny,allow
    Allow from all
</Proxy>

# --- vhost R (port 80): RewriteRule [P] front-end -----------------------------
# The canonical CVE-2011-3368 vector. Guarded by the mod_rewrite.c hook_uri2file
# request-URI check (applied on V1 and V2).
<VirtualHost *:80>
    RewriteEngine On
    RewriteRule .* http://legit-backend%{REQUEST_URI} [P]
</VirtualHost>

# --- vhost P (port 8080): ProxyPassMatch front-end ----------------------------
# The sibling reverse-proxy directive reaching the SAME sink. Guarded by the
# mod_proxy.c proxy_trans request-URI check (applied on V2 only). On V1 this
# front-end is still open -> the incomplete-fix residual.
<VirtualHost *:8080>
    ProxyPassMatch ^(.*)$ http://legit-backend$1
</VirtualHost>

ErrorLog "logs/error_log"
LogLevel warn
