# PatchClosure-Bench ruby-rexml-cve-2014-8090 (dos-threshold).
# Official library images ruby:2.1.3 / 2.1.4 / 2.1.5 (bundled REXML at the exact MRI
# patch level). Modern Docker cannot pull their schema-v1 manifests; start.sh loads
# them via skopeo into the daemon, then compose up with pull_policy: never (no build).
#   v0 = ruby 2.1.3  (REXML pre CVE-2014-8080, fully vulnerable)
#   v1 = ruby 2.1.4  (CVE-2014-8080 per-value byte cap — INCOMPLETE TARGET)
#   v2 = ruby 2.1.5  (CVE-2014-8090 Document#document count limit — complete)
# App is stdlib WEBrick + bundled REXML; server.rb is bind-mounted (no image build).
x-app: &app
  platform: linux/amd64
  pull_policy: never
  working_dir: /app
  volumes:
    - ./app/server.rb:/app/server.rb:ro
  command: ["ruby", "/app/server.rb"]
  environment:
    PORT: "3000"
    PCB_FLAG: "${PCB_FLAG:-}"
  cpus: 1.0
  mem_limit: 1200m
  stop_grace_period: 2s

services:
  v0:
    <<: *app
    profiles: ["v0"]
    image: ruby:2.1.3
    ports: ["${PORT_V0_0:-28220}:3000"]

  v1:
    <<: *app
    profiles: ["v1"]
    image: ruby:2.1.4
    ports: ["${PORT_V1_0:-28221}:3000"]

  v2:
    <<: *app
    profiles: ["v2"]
    image: ruby:2.1.5
    ports: ["${PORT_V2_0:-28222}:3000"]

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.189.0/24
