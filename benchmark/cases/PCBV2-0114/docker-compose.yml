# freescout-cve-2026-53593 (CVE-2025-48471 -> CVE-2026-53593, upload denylist bypass).
#
# REAL APP, EXTERNAL HTTP TRIGGER. Each v0/v1/v2 service builds from the FULL
# FreeScout tree (host-fetched git tag / GitHub tarball COPYed into the image —
# not an in-container git clone, not a Helper.php harness). Laravel artisan
# migrate + create-user + factories seed a mailbox/conversation; Apache serves
# public/. The sink is the real Helper::uploadFile + sanitizeUploadedFileName.
#
# Host verify hits 127.0.0.1:published-port. APP_URL stays the compose service
# origin (http://v0 / http://v1) like 0113; APP_TRUSTED_HOSTS includes 127.0.0.1
# so those host probes are accepted. Canary /canary.txt is planted by entrypoint.
services:
  mysql:
    image: "mariadb:10.6"
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: "freescout"
      MYSQL_USER: "freescout"
      MYSQL_PASSWORD: "freescout"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  v0:
    profiles: ["v0"]
    build: {context: ., args: {FS_REF: "1.8.178"}}
    image: "pcb-0114-freescout:v0"
    environment:
      APP_URL: "http://v0"
      APP_TRUSTED_HOSTS: "127.0.0.1,localhost,v0,v1,v2"
      DB_HOST: "mysql"
      DB_DATABASE: "freescout_v0"
      DB_USERNAME: "freescout"
      DB_PASSWORD: "freescout"
      DB_ROOT_PASSWORD: "root"
      SESSION_SAME_SITE: "lax"
      SESSION_SECURE_COOKIE: "false"
      APP_CSP_ENABLED: "false"
      FS_ADMIN_EMAIL: "admin@pcb.local"
      FS_ADMIN_PASSWORD: "PcbAdminPass123"
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG}"
    ports: ["${PORT_V0_0:-33660}:80"]
    depends_on:
      mysql: {condition: service_healthy}

  v1:
    profiles: ["v1"]
    build: {context: ., args: {FS_REF: "1.8.223"}}
    image: "pcb-0114-freescout:v1"
    environment:
      APP_URL: "http://v1"
      APP_TRUSTED_HOSTS: "127.0.0.1,localhost,v0,v1,v2"
      DB_HOST: "mysql"
      DB_DATABASE: "freescout_v1"
      DB_USERNAME: "freescout"
      DB_PASSWORD: "freescout"
      DB_ROOT_PASSWORD: "root"
      SESSION_SAME_SITE: "lax"
      SESSION_SECURE_COOKIE: "false"
      APP_CSP_ENABLED: "false"
      FS_ADMIN_EMAIL: "admin@pcb.local"
      FS_ADMIN_PASSWORD: "PcbAdminPass123"
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG}"
    ports: ["${PORT_V1_0:-33661}:80"]
    depends_on:
      mysql: {condition: service_healthy}

  v2:
    profiles: ["v2"]
    build: {context: ., args: {FS_REF: "1.8.224"}}
    image: "pcb-0114-freescout:v2"
    environment:
      APP_URL: "http://v2"
      APP_TRUSTED_HOSTS: "127.0.0.1,localhost,v0,v1,v2"
      DB_HOST: "mysql"
      DB_DATABASE: "freescout_v2"
      DB_USERNAME: "freescout"
      DB_PASSWORD: "freescout"
      DB_ROOT_PASSWORD: "root"
      SESSION_SAME_SITE: "lax"
      SESSION_SECURE_COOKIE: "false"
      APP_CSP_ENABLED: "false"
      FS_ADMIN_EMAIL: "admin@pcb.local"
      FS_ADMIN_PASSWORD: "PcbAdminPass123"
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG}"
    ports: ["${PORT_V2_0:-33662}:80"]
    depends_on:
      mysql: {condition: service_healthy}
