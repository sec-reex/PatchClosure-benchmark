<VirtualHost *:80>
    DocumentRoot /opt/phpmyfaq-src/phpmyfaq

    # Expose the per-run flag / admin password to PHP (getenv) for the harness reset endpoint.
    PassEnv PCB_FLAG PMF_ADMIN_PW PMF_EDITOR_PW

    <Directory /opt/phpmyfaq-src/phpmyfaq>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
