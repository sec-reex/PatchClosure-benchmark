# PatchClosure-Bench: keystone6-cve-2026-33326
# V0 = 6.4.0  (CVE-2025-46720 open: update/delete multi-unique `where` value-oracle)
# V1 = 6.5.1  (CVE-2025-46720 fixed, but findMany `cursor` UniqueWhere still unguarded -> TARGET)
# V2 = 6.5.2  (CVE-2026-33326 fixed: cursor guarded)
services:
  v0:
    build:
      context: .
      args:
        KS_VERSION: 6.4.0
    image: pcb-keystone6-33326-v0
    environment:
      PCB_FLAG: "${PCB_FLAG:-PCBFLAG-unset}"
    ports:
      - "${PORT_V0_0:-41390}:3000"
    profiles: ["v0"]

  v1:
    build:
      context: .
      args:
        KS_VERSION: 6.5.1
    image: pcb-keystone6-33326-v1
    environment:
      PCB_FLAG: "${PCB_FLAG:-PCBFLAG-unset}"
    ports:
      - "${PORT_V1_0:-41391}:3000"
    profiles: ["v1"]

  v2:
    build:
      context: .
      args:
        KS_VERSION: 6.5.2
    image: pcb-keystone6-33326-v2
    environment:
      PCB_FLAG: "${PCB_FLAG:-PCBFLAG-unset}"
    ports:
      - "${PORT_V2_0:-41392}:3000"
    profiles: ["v2"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.62.0/24
