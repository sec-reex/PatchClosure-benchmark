# PatchClosure-Bench overlay for CVE-2024-39884 -> CVE-2024-40725.
#
# Exposes the LEGACY content-type-based handler configuration the CVE is about:
# a handler selected from the file's content-type (set by `AddType`), NOT via an
# explicit SetHandler/AddHandler. Here the content type "application/x-httpd-cgi"
# is mod_cgi's magic type: when the handler IS honored the script is EXECUTED
# (STDOUT only, source hidden); when the content-type-derived handler is SKIPPED
# (the bug: an "indirect"/subrequest whose content-type lost its "trusted" flag)
# the core default_handler serves the RAW SOURCE, disclosing the planted flag.
#
# No application/business code is modified. The script (with the ${PCB_FLAG} in a
# source comment) is planted by the compose entrypoint (environment, not here).

LoadModule cgid_module modules/mod_cgid.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule negotiation_module modules/mod_negotiation.so
LoadModule actions_module modules/mod_actions.so

# Legacy content-type-based handler config (the CVE's exact subject):
AddType application/x-httpd-cgi .cgi

<Directory "/usr/local/apache2/htdocs">
    Options +ExecCGI +MultiViews +FollowSymLinks +Includes +Indexes
    AllowOverride None
    Require all granted
</Directory>

# Vector: DirectoryIndex (mod_dir -> ap_internal_fast_redirect) == CVE-2024-40725.
<Directory "/usr/local/apache2/htdocs/idx">
    Options +ExecCGI
    DirectoryIndex secret.cgi
    Require all granted
</Directory>

# Vector: full internal redirect (mod_rewrite [PT]) -> ap_internal_redirect.
RewriteEngine On
RewriteRule ^/redir$ /idx/secret.cgi [PT,L]

# Vector: ErrorDocument internal redirect.
ErrorDocument 404 /idx/secret.cgi
