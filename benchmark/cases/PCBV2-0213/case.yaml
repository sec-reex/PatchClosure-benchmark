case_id: PCBV2-0213
public_name: wordpress-wp-super-cache-plugin-cve-2013-2011
run_mode: real-app-http
oracle_family: read_exfil
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: wordpress_plugin_zip
  repo: https://downloads.wordpress.org/plugin/wp-super-cache
  v0: "1.2"
  v1: "1.3.1"
service:
  # Host publishes ${PORT_WP_V*_0}:80 — not host :80. Platform HTTP/TCP
  # readiness on :80 times out. start.sh waits for wp-login + /flag/ready.
  readiness: none
  exposed_ports: [80]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
