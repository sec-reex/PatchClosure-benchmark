# PatchClosure-Bench recipe for wordpress-wp-super-cache-plugin-cve-2013-2011.
# Pair: CVE-2013-2009 -> CVE-2013-2011  (WP Super Cache, PHP code injection via mfunc
# comment tags baked into the generated PHP page cache; CWE-94 / CWE-116).
#
# READ-EXFIL (code-injection into cache). php:8.2-apache + the REAL WP Super Cache plugin
# source for the pinned version fetched at build. harness.php executes the version's REAL
# no_mfunc_in_comments() guard + REAL cache-generation sink verbatim.
#
#   V0 = WP Super Cache 1.2    : NO no_mfunc_in_comments guard
#                                -> single-comment <!--mfunc--> executes (CVE-2013-2009)
#   V1 = WP Super Cache 1.3.1  : CVE-2013-2009 guard zaps a comment only if open+close
#                                appear together -> single-comment BLOCKED, but tags
#                                SPLIT across two comments recombine in phase2
#                                -> CVE-2013-2011 residual  <- TARGET
#   V2 = WP Super Cache 1.3.2  : CVE-2013-2011 fix zaps on the OPENING mfunc tag alone
#                                -> split multi-comment residual BLOCKED
#
# Canary: ${PCB_FLAG} is planted at /flag/pcb_flag.txt OUTSIDE the docroot; it can
# surface ONLY when an mfunc tag survives into Super Cache's executed cache PHP.
x-wp: &wp
  build:
    context: .
    dockerfile: Dockerfile
  pull_policy: never
  environment:
    PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/harness.php?ping=1 >/dev/null 2>&1"]
    interval: 5s
    timeout: 5s
    start_period: 10s
    retries: 20

services:
  v0:
    <<: *wp
    profiles: ["v0"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WPSC_VERSION: "1.2"
    ports: ["${PORT_V0_0:-39550}:80"]

  v1:
    <<: *wp
    profiles: ["v1"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WPSC_VERSION: "1.3.1"
    ports: ["${PORT_V1_0:-39551}:80"]

  v2:
    <<: *wp
    profiles: ["v2"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WPSC_VERSION: "1.3.2"
    ports: ["${PORT_V2_0:-39552}:80"]

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.213.0/24
