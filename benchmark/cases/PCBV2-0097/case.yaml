case_id: PCBV2-0097
public_name: deser_concretecms_unserialize
run_mode: real-app-http
oracle_family: tcp_cli_extension
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: git
  repo: https://github.com/concretecms/concretecms.git
  v0: 9.4.7
  v1: 9.4.8
service:
  # Apache answers on :80 before `c5:install` + pcb_driver.php copy finish.
  # start.sh waits until /pcb_driver.php returns HTTP 200.
  readiness: none
  exposed_ports: [80]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
