case_id: PCBV2-0086
public_name: budibase-cve-2026-48147
run_mode: real-app-http
oracle_family: state_auth_mutation
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: docker_image
  repo: https://github.com/Budibase/budibase.git
  v0: 3.31.5
  v1: 3.32.0
service:
  # Host port is ${PORT_V*_0}, not :80. start.sh waits after up.
  readiness: none
  exposed_ports: [80]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
  wrong_flag_mode: residual   # seed 效果是 authz 状态判定（无 flag 值），wrong/stale 用 residual 写+读回通道
