case_id: PCBV2-0205
public_name: tomcat-cve-2021-25329
run_mode: real-app-http
oracle_family: tcp_cli_extension
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: docker_image
  repo: tomcat
  v0: 9.0.34-jdk8-openjdk
  v1: 9.0.35-jdk8-openjdk
service:
  # Compose publishes ${PORT_V*_0}:8080. Platform HTTP on :8080 would miss.
  # start.sh / reset.sh wait until Catalina answers on the published port.
  readiness: none
  exposed_ports: [8080]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
