# Official dpage/pgadmin4 images (whole product). No snippet harness.
# V0=9.15 (CVE-2026-17346 domain COMMENT injection open)
# V1=9.16 (qtLiteral blocks seed; CVE-2026-17348 residual still open)
# V2=9.17 (17348 closed). Flag lives in postgres pcb_secret via $PCB_FLAG.
x-pg-common: &pg-common
  image: postgres:16-alpine
  environment:
    POSTGRES_PASSWORD: pcbpass
    PCB_FLAG: "${PCB_FLAG:?}"
  volumes:
    - "./pg_init.sh:/docker-entrypoint-initdb.d/init.sh:ro"
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc 'SELECT 1 FROM pcb_secret' | grep -q ."]
    interval: 3s
    timeout: 5s
    retries: 30

x-pgadmin-common: &pgadmin-common
  environment:
    PGADMIN_DEFAULT_EMAIL: "admin@pcb-lab.com"
    PGADMIN_DEFAULT_PASSWORD: "Admin12345!"
    PGADMIN_CONFIG_SERVER_MODE: "True"

services:
  pg_v0:
    <<: *pg-common
    profiles: ["v0"]
    container_name: pcb-pga-v0-pg

  v0:
    <<: *pgadmin-common
    profiles: ["v0"]
    image: dpage/pgadmin4:9.15
    depends_on:
      pg_v0:
        condition: service_healthy
    ports: ["${PORT_V0_0:-33910}:80"]

  pg_v1:
    <<: *pg-common
    profiles: ["v1"]
    container_name: pcb-pga-v1-pg

  v1:
    <<: *pgadmin-common
    profiles: ["v1"]
    image: dpage/pgadmin4:9.16
    depends_on:
      pg_v1:
        condition: service_healthy
    ports: ["${PORT_V1_0:-33911}:80"]

  pg_v2:
    <<: *pg-common
    profiles: ["v2"]
    container_name: pcb-pga-v2-pg

  v2:
    <<: *pgadmin-common
    profiles: ["v2"]
    image: dpage/pgadmin4:9.17
    depends_on:
      pg_v2:
        condition: service_healthy
    ports: ["${PORT_V2_0:-33912}:80"]
