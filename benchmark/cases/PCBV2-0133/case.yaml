case_id: PCBV2-0133
public_name: keycloak-cve-2026-3872
run_mode: real-app-http
oracle_family: read_exfil
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: docker_image
  repo: quay.io/keycloak/keycloak
  v0: "24.0.2"
  v1: "24.0.3"
service:
  # Keycloak host ports are ${PORT_V*_0}:8080. Attacker sidecar stays on
  # 127.0.0.1:40052 (realm + probe). Platform HTTP probe on a stale port
  # would time out; start.sh waits until /realms/pcb answers.
  readiness: none
  exposed_ports: [8080]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
