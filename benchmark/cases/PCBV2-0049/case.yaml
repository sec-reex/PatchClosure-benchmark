case_id: PCBV2-0049
public_name: apache-mina-cve-2026-42778
run_mode: real-app-tcp
oracle_family: tcp_cli_extension
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: git
  repo: https://github.com/apache/mina.git
  v0: 2.2.3
  v1: 2.2.4
service:
  # MINA is TCP-only; host port is ${PORT_V*_0}. start.sh waits after up.
  readiness: none
  exposed_ports: [9009]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
