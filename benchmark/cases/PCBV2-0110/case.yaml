case_id: PCBV2-0110
public_name: fastxmlparser_entity_expansion_limit
run_mode: real-app-http
oracle_family: dos_threshold
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: npm
  repo: https://github.com/NaturalIntelligence/fast-xml-parser.git
  v0: "5.3.5"
  v1: "5.3.6"
service:
  # Compose publishes ${PORT_V*_0}:80. Platform HTTP on container :80 would miss
  # the randomized host port; start.sh / reset.sh wait until GET /health answers.
  readiness: none
  exposed_ports: [80]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
  wrong_flag_mode: residual
