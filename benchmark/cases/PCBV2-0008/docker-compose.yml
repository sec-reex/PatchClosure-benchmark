# PatchClosure-Bench: semver-regex pre-release ReDoS, CVE-2021-3795 -> CVE-2021-43307.
# REAL Express HTTP service running the REAL published `semver-regex` per profile. The ReDoS is
# triggered by an EXTERNAL HTTP request (POST /check {version}) and observed as SERVER-SIDE hang:
# the regex .test() runs synchronously on the event loop. Watchdog probes GET /health and releases
# the per-run PCB_FLAG only after the event loop is wedged (wrong/stale RUN_FLAG cannot match).
#
#   original  '1.2.3-'+'a-a.'x22+'!'  : V0(3.1.1) HANGS | V1(3.1.3) fast | V2(3.1.4) fast   (CVE-2021-3795)
#   residual  '0.0.1-'+'-.--'x14+' '  : V0 fast | V1 HANGS | V2 fast                        (CVE-2021-43307, INCOMPLETE FIX)
#   benign    '1.2.3-alpha.1'         : fast on V0,V1,V2                                     (control)
services:
  v0:
    profiles: ["v0"]
    image: pcb-semver-regex-prerelease-redos-v0
    build:
      context: .
      args:
        SEMVER_REGEX_VERSION: "3.1.1"
    ports: ["${PORT_V0_0:-28131}:3000"]
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 2s

  v1:
    profiles: ["v1"]
    image: pcb-semver-regex-prerelease-redos-v1
    build:
      context: .
      args:
        SEMVER_REGEX_VERSION: "3.1.3"
    ports: ["${PORT_V1_0:-28133}:3000"]
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 2s

  v2:
    profiles: ["v2"]
    image: pcb-semver-regex-prerelease-redos-v2
    build:
      context: .
      args:
        SEMVER_REGEX_VERSION: "3.1.4"
    ports: ["${PORT_V2_0:-28134}:3000"]
    cpus: 1.0
    mem_limit: 512m
    stop_grace_period: 2s

  watchdog:
    profiles: ["v0", "v1", "v2"]
    image: python:3.12-alpine
    volumes:
      - ./watchdog.py:/wd.py:ro
    environment:
      PCB_FLAG: "${PCB_FLAG}"
      VERSION: "${VERSION:-v1}"
    command: ["python", "/wd.py"]
    ports: ["${PORT_WATCHDOG_0:-28138}:8888"]
    cpus: 0.5
    mem_limit: 128m
