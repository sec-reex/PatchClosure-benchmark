# PatchClosure-Bench recipe for fastify-static-cve-2026-7120.
# Profiles:
#   v0 = @fastify/static 10.1.0 (CVE-2026-15074 '..' + CVE-2026-7120 '/./' both bypass)
#   v1 = @fastify/static 10.1.1 (15074 fixed; 7120 '/./' still bypasses)  <- target
#   v2 = @fastify/static 10.1.2 (7120 fixed)
# Canary planted at /data/root/private/canary.txt by entrypoint; /private/ is
# denied by allowedPath (pathname startsWith /private/).
x-app: &app
  build:
    context: .
    args:
      FFS_VERSION: ""
  entrypoint:
    - /bin/sh
    - -c
    - |
      mkdir -p /data/root/private
      printf '%s' "${PCB_FLAG:?set PCB_FLAG}" > /data/root/private/canary.txt
      chmod 644 /data/root/private/canary.txt
      exec node app.js
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(0)).catch(()=>process.exit(1))"]
    interval: 3s
    timeout: 3s
    retries: 10

services:
  v0:
    <<: *app
    profiles: ["v0"]
    build:
      context: .
      args:
        FFS_VERSION: "10.1.0"
    ports: ["${PORT_V0_0:-55140}:3000"]
    environment:
      PCB_FLAG: "${PCB_FLAG}"

  v1:
    <<: *app
    profiles: ["v1"]
    build:
      context: .
      args:
        FFS_VERSION: "10.1.1"
    ports: ["${PORT_V1_0:-55141}:3000"]
    environment:
      PCB_FLAG: "${PCB_FLAG}"

  v2:
    <<: *app
    profiles: ["v2"]
    build:
      context: .
      args:
        FFS_VERSION: "10.1.2"
    ports: ["${PORT_V2_0:-55142}:3000"]
    environment:
      PCB_FLAG: "${PCB_FLAG}"
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.110.0/24
