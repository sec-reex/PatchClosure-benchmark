case_id: PCBV2-0081
public_name: astro-cloudflare-cve-2026-41321
run_mode: real-app-http
oracle_family: ssrf_sidecar
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: npm
  repo: https://www.npmjs.com/package/@astrojs/cloudflare
  v0: "12.6.5"
  v1: "13.1.9"
service:
  # Compose publishes ${PORT_APP_V*_0}:4321. start.sh / reset.sh wait on that host port.
  readiness: none
  exposed_ports: [4321]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
