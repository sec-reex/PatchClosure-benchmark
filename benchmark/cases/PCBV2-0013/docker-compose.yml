# PatchClosure-Bench recipe for jackson-databind-cve-2017-17485 -- REAL jackson-databind per version behind a
# REAL Java HTTP REST service, deserialization triggered by an EXTERNAL HTTP request whose JSON body is
# polymorphically deserialized.
# CVE-2017-7525 [default-typing polymorphic deserialization -> RCE; the fix adds the
#  BeanDeserializerFactory.checkIllegalTypes / DEFAULT_NO_DESER_CLASS_NAMES class-name blacklist, extended by
#  CVE-2017-15095] -> CVE-2017-17485 [that enumerated blacklist is STILL INCOMPLETE: the Spring
#  application-context gadget names still deserialize on 2.9.3; 2.9.4 adds Spring superclass handling via
#  SubTypeValidator.validateSubType (databind#1855)], CWE-502. Genuine incomplete fix.
#
# Each profile builds the shared Dockerfile pinning the REAL jackson-databind at JACKSON_VER, boots the HTTP
# service, and maps its port 8080 to a unique host port. The oracle drives POST /deser over real external HTTP
# with a benign default-typing JSON body ["<FQCN>", {}]; ${PCB_FLAG} is planted per-run via env.
#
# Profiles:
#   v0 (gate)     = jackson-databind 2.8.8  -- pre-CVE-2017-7525; NO blacklist -> original seed instantiates.
#   v1 (GIVEN, target) = jackson-databind 2.9.3 -- -7525 + -15095 FIXED (InvokerTransformer BLOCKED) but
#        INCOMPLETE for -17485 (Spring FileSystemXmlApplicationContext still deserializes). Target.
#   v2 (negative) = jackson-databind 2.9.4 -- CVE-2017-17485 FIXED (databind#1855 Spring superclass walk) ->
#        the Spring residual is blocked.
services:
  v0:
    profiles: ["v0"]
    build: {context: ".", dockerfile: "Dockerfile", args: {JACKSON_VER: "2.8.8"}}
    image: "pcb/jackson-deser-17485-http:2.8.8"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V0_0:-18770}:8080"]

  v1:
    profiles: ["v1"]
    build: {context: ".", dockerfile: "Dockerfile", args: {JACKSON_VER: "2.9.3"}}
    image: "pcb/jackson-deser-17485-http:2.9.3"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V1_0:-18771}:8080"]

  v2:
    profiles: ["v2"]
    build: {context: ".", dockerfile: "Dockerfile", args: {JACKSON_VER: "2.9.4"}}
    image: "pcb/jackson-deser-17485-http:2.9.4"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V2_0:-18772}:8080"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.14.0/24
