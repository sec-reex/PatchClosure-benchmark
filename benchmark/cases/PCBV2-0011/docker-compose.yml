# PatchClosure-Bench env for drupal-core-cve-2018-7602  (CVE-2018-7600 -> CVE-2018-7602).
# Drupal core render-array '#'-callable code execution ("Drupalgeddon2" -> "Drupalgeddon3").
#   V0 = drupal:8.5.0 : no RequestSanitizer                          -> '#'-keys reach the render sink   (pre CVE-2018-7600)
#   V1 = drupal:8.5.1 : CVE-2018-7600 fix strips '#'-keys from GET/POST/COOKIE only, NOT inside
#                       the 'destination' string                     -> destination channel still open  <- TARGET
#   V2 = drupal:8.5.3 : CVE-2018-7602 fix adds checkDestination()    -> destination channel closed
# Faithful-core over the pinned OFFICIAL image: the REAL upstream \Drupal\Core\Security\RequestSanitizer
# (+ UrlHelper + Symfony Request) runs verbatim via Drupal's own autoloader (see harness.php/Dockerfile).
# Same render-callback sink for seed & residual, same flag channel -> Variant A. Canary ${PCB_FLAG}
# planted at /flag/pcb_flag.txt OUTSIDE docroot; only an executed '#'-callable can echo it.
x-app: &app
  environment: &app-env
    PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
  healthcheck:
    test: ["CMD", "sh", "-c", "test -f /flag/pcb_flag.txt && curl -fsS 'http://127.0.0.1/harness.php?ping=1' >/dev/null"]
    interval: 5s
    timeout: 5s
    retries: 40

services:
  v0:
    <<: *app
    profiles: ["v0"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {DRUPAL_TAG: "8.5.0"}
    ports: ["${PORT_V0_0:-39480}:80"]

  v1:
    <<: *app
    profiles: ["v1"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {DRUPAL_TAG: "8.5.1"}
    ports: ["${PORT_V1_0:-39481}:80"]

  v2:
    <<: *app
    profiles: ["v2"]
    build:
      context: .
      dockerfile: Dockerfile
      args: {DRUPAL_TAG: "8.5.3"}
    ports: ["${PORT_V2_0:-39482}:80"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.12.0/24
