# PatchClosure-Bench recipe for jackson-databind-cve-2018-5968 -- REAL jackson-databind per version behind a
# REAL Java HTTP REST service, deserialization triggered by an EXTERNAL HTTP request whose JSON body is
# polymorphically deserialized.
# CVE-2017-7525 [default-typing polymorphic deserialization -> RCE; the -7525 fix adds the
#  SubTypeValidator.validateSubType / DEFAULT_NO_DESER_CLASS_NAMES class-name blacklist (databind#1599),
#  extended by -15095 (#1680/#1737) and -17485 (#1855)]
#  -> CVE-2018-5968 [that maintained blacklist is STILL INCOMPLETE: the gadget class names
#  org.hibernate.jmx.StatisticsService and org.apache.ibatis.datasource.jndi.JndiDataSourceFactory are not on
#  the 2.8.11 list and still deserialize; 2.8.11.1 adds them via databind#1899], CWE-502. Genuine incomplete fix.
#
# Each profile builds the shared Dockerfile pinning the REAL jackson-databind at JACKSON_VER, boots the HTTP
# service, and maps its port 8080 to a unique host port. The oracle drives POST /deser over real external HTTP
# with a benign default-typing JSON body ["<FQCN>", {}]; ${PCB_FLAG} is planted per-run via env.
services:
  v0:
    profiles: ["v0"]
    build: {context: ".", dockerfile: "Dockerfile", args: {JACKSON_VER: "2.8.8"}}
    image: "pcb/jackson-deser-5968-http:2.8.8"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V0_0:-18780}:8080"]

  v1:
    profiles: ["v1"]
    build: {context: ".", dockerfile: "Dockerfile", args: {JACKSON_VER: "2.8.11"}}
    image: "pcb/jackson-deser-5968-http:2.8.11"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V1_0:-18781}:8080"]

  v2:
    profiles: ["v2"]
    build: {context: ".", dockerfile: "Dockerfile", args: {JACKSON_VER: "2.8.11.1"}}
    image: "pcb/jackson-deser-5968-http:2.8.11.1"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V2_0:-18782}:8080"]
networks:
  default:
    ipam:
      config:
        - subnet: 172.31.5.0/24
