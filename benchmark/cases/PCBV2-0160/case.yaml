case_id: PCBV2-0160
public_name: openssl-c_rehash-shell-metachar-incomplete
run_mode: real-app-cli
oracle_family: read_exfil
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: git
  repo: https://github.com/openssl/openssl.git
  v0: 1.1.1n
  v1: 1.1.1o
service:
  # Exec-style CLI: compose publishes no host port; probe is `compose run --rm vN <flavor>`.
  # Platform HTTP readiness would time out; start.sh builds the image and smokes openssl.
  readiness: none
  exposed_ports: [80]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
