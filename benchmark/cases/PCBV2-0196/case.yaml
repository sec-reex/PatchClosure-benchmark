case_id: PCBV2-0196
public_name: spring-framework-cve-2022-22965
run_mode: real-app-http
oracle_family: read_exfil
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  # Runtime is Maven Central spring-webmvc/spring-beans + official Tomcat.
  # Do not clone spring-framework.git (empty tags previously broke fetch).
  type: maven
  repo: org.springframework:spring-webmvc
  v0: "3.0.2.RELEASE"
  v1: "5.3.17"
service:
  # Host port is ${PORT_V*_0}, not :8080. start.sh waits for /hello after deploy.
  readiness: none
  exposed_ports: [8080]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
