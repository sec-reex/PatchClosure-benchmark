case_id: PCBV2-0112
public_name: fileorganizer-wordpress-plugin-cve-2026-11962
run_mode: real-app-http
oracle_family: sibling_endpoint
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  type: git
  repo: https://github.com/wordpress.org/plugins/fileorganizer.git
  v0: 1.0.9
  v1: 1.1.0
service:
  # Host port is ${PORT_WP_V*_0}, not :80. start.sh waits after up.
  readiness: none
  exposed_ports: [80]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
