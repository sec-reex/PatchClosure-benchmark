# PatchClosure-Bench: cockpit-cve-2018-9302 (CVE-2017-14611 -> CVE-2018-9302).
# Each profile installs the FULL agentejo/cockpit tree at a pinned commit
# and serves it from Apache. The SSRF sink is the product path
# /assets/lib/fuc.js.php?url= (not a one-file extract).
#
#   CVE-2017-14611 (seed): any scheme -> file:///flag.txt
#   V1 fix: ^https?:// only -> file:// blocked
#   CVE-2018-9302 (residual): http://intranet/flag.txt still SSRFs
#
# intranet has no host port — reachable only via the product proxy.

services:
  v1:
    profiles: ["v1"]
    build:
      context: .
      args:
        COCKPIT_REF: "0711d4f9dd6d38d834141d619d6fe141ca146f2f"
    image: pcb-cockpit-9302:v1
    ports: ["${PORT_V1_0:-39002}:80"]
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$${PCB_FLAG}" > /flag.txt && chmod 644 /flag.txt
        exec apache2-foreground
    depends_on: ["intranet"]

  v0:
    profiles: ["v0"]
    build:
      context: .
      args:
        COCKPIT_REF: "a5fb51cb51178ef330be3db45eb583621e9891d0"
    image: pcb-cockpit-9302:v0
    ports: ["${PORT_V0_0:-39001}:80"]
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$${PCB_FLAG}" > /flag.txt && chmod 644 /flag.txt
        exec apache2-foreground
    depends_on: ["intranet"]

  intranet:
    profiles: ["v0", "v1", "v2"]
    image: php:7.4-cli
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /flagdata
        printf '%s' "$${PCB_FLAG}" > /flagdata/flag.txt && chmod 644 /flagdata/flag.txt
        exec php -S 0.0.0.0:80 -t /flagdata

  # V2 = full cockpit @279e6690 (assets/lib/fuc.js.php removed).
  v2:
    profiles: ["v2"]
    build:
      context: .
      args:
        COCKPIT_REF: "279e66905afdca26f568ee5c3728c63d27e8feaf"
    image: pcb-cockpit-9302:v2
    ports: ["${PORT_V2_0:-39003}:80"]
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s' "$${PCB_FLAG}" > /flag.txt && chmod 644 /flag.txt
        exec apache2-foreground
    depends_on: ["intranet"]
