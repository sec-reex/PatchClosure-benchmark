case_id: PCBV2-0067
public_name: deser_jenkins_remoting
run_mode: real-app-tcp
oracle_family: tcp_cli_extension
compose_file: docker-compose.yml
scripts:
  prepare: scripts/prepare.sh
  fetch_source: scripts/fetch_source.sh
  start: scripts/start.sh
  verify: scripts/verify.sh
  reset: scripts/reset.sh
  stop: scripts/stop.sh
source:
  # Runtime is the published org.jenkins-ci.main:remoting jar from the
  # Jenkins Maven repo (Dockerfile maven-dependency-plugin). Do not clone remoting.git.
  type: maven
  repo: org.jenkins-ci.main:remoting
  v0: "2.52"
  v1: "2.53"
service:
  # 9009 is remoting TCP, not HTTP; host port is ${PORT_V*_0}. start.sh waits for TCP.
  readiness: none
  exposed_ports: [9009]
verification:
  seed_command: [scripts/verify.sh, --seed]
  residual_command: [scripts/verify.sh, --residual]
