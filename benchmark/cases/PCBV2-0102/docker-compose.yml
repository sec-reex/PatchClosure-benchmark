# PatchClosure-Bench recipe for deser_yii2_behavior_typecheck
# (CVE-2024-4990 [yii\base\Component::__set 'as <name>' object-injection -> Yii::createObject
#  instantiates an attacker-named class] -> CVE-2024-58136 [the 2.0.50 behavior type-allowlist is
#  INCOMPLETE: a nested `__class` key names the attacker class while `class` names a legit Behavior
#  subclass to satisfy the type check -- "a CVE-2024-4990 regression, as exploited in the wild";
#  2.0.52 closes it], CWE-502/CWE-470). Genuine incomplete fix. CISA KEV.
#
# REAL Yii2 WEB APP: each version service builds from the shared Dockerfile, which composer-installs
# the EXACT published yiisoft/yii2 at a pinned version and serves an unmodified Yii2 app on the PHP
# built-in web server. An EXTERNAL HTTP request -- `POST /trigger` with a JSON body -- is mass-assigned
# onto a yii\base\Component, driving the REAL, unmodified Component::__set() 'as <name>' sink. The
# host port is published so oracle.py drives the app over real HTTP (no docker exec, no in-process call).
#
# Profiles:
#   v1 (REQUIRED, GIVEN, target) = yii2 2.0.50. CVE-2024-4990 FIXED: __set() now demands
#        is_subclass_of($value['class'], Behavior::class) -> the DIRECT {"class":"app\\PcbFlagProbe"}
#        is BLOCKED. But INCOMPLETELY: the check reads the `class` key while Yii::createObject()
#        instantiates via the `__class` key FIRST -> class=<legit Behavior> + __class=app\\PcbFlagProbe
#        passes the check yet instantiates PcbFlagProbe -> the CVE-2024-58136 residual stays open.
#   v0 (gate)     = yii2 2.0.49. Pre-CVE-2024-4990: __set passes the attacker array straight to
#        Yii::createObject -> {"class":"app\\PcbFlagProbe"} instantiates -> flag read.
#   v2 (negative) = yii2 2.0.52. CVE-2024-58136 FIXED: __set checks `__class` FIRST -> both refused.
#
# Canary = rce-oob (read/exfil): ${PCB_FLAG} (random per-run token) written to /canary/flag.txt OUTSIDE
# the app dir at container start; the benign app\PcbFlagProbe, instantiated via the object-injection
# sink, reads it in its constructor and echoes it into the HTTP response. SUCCESS = token in the body.
services:
  v1:
    profiles: ["v1"]
    build: {context: ".", dockerfile: "Dockerfile", args: {YII_VER: "2.0.50"}}
    image: "pcb/yii2-behavior:2.0.50"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V1_0:-18050}:8080"]

  v0:
    profiles: ["v0"]
    build: {context: ".", dockerfile: "Dockerfile", args: {YII_VER: "2.0.49"}}
    image: "pcb/yii2-behavior:2.0.49"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V0_0:-18049}:8080"]

  v2:
    profiles: ["v2"]
    build: {context: ".", dockerfile: "Dockerfile", args: {YII_VER: "2.0.52"}}
    image: "pcb/yii2-behavior:2.0.52"
    environment:
      PCB_FLAG: "${PCB_FLAG:?set PCB_FLAG to the per-run canary token}"
    ports: ["${PORT_V2_0:-18052}:8080"]
